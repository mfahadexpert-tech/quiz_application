
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Web Technologies Quiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container py-5">

        <!-- Website heading -->
        <header class="text-center mb-4">
            <h1>Web Technologies Quiz</h1>
            <p>Test your HTML, CSS and JavaScript knowledge</p>

            <button id="themeBtn" class="btn btn-secondary">
                Dark Mode
            </button>
        </header>

        <!-- Progress bar -->
        <div id="progressBar" class="progress-box mb-4">
        </div>

        <!-- Quiz card -->
        <section class="quiz-card">

            <div class="d-flex justify-content-between">
                <p id="questionNumber">Question 1 / 5</p>
                <p id="timer">Time Left: 15s</p>
            </div>

            <h2 id="questionText"></h2>

            <!-- Answers will appear here -->
            <div id="answerOptions"></div>

            <button id="nextBtn"
                    class="btn btn-success mt-4"
                    disabled>
                Next →
            </button>

        </section>

        <!-- Result section -->
        <section id="resultSection"
                 class="quiz-card text-center mt-4"
                 style="display:none;">

            <h2>Quiz Completed!</h2>

            <p id="scoreText"></p>

            <button id="downloadBtn"
                    class="btn btn-primary">
                Download PDF
            </button>

            <button id="restartBtn"
                    class="btn btn-secondary">
                Restart Quiz
            </button>

        </section>

    </main>

    <!-- PDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- JavaScript files -->
    <script src="questions.js"></script>
    <script src="timer.js"></script>
    <script src="quiz.js"></script>
    <script src="theme.js"></script>
    <script src="result.js"></script>

</body>
</html>
